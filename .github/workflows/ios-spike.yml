name: iOS spike (unsigned IPA)

on:
  workflow_dispatch:
  push:
    paths:
      - 'kmp-spike/**'
      - '.github/workflows/ios-spike.yml'

jobs:
  ipa:
    name: Build unsigned IPA
    runs-on: macos-latest
    defaults:
      run:
        working-directory: kmp-spike
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Archive iOS app (unsigned)
        working-directory: kmp-spike/iosApp
        run: |
          xcodebuild -project iosApp.xcodeproj -scheme iosApp \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            archive CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          APP=$(find "$RUNNER_TEMP/iosApp.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
          echo "App bundle: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr halal-spike-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: halal-spike-unsigned-ipa
          path: kmp-spike/halal-spike-unsigned.ipa
          retention-days: 14
