<!doctype html>
<!-- Store/YouTube promo v2, styled like store_assets/screenshots_v2 (Fraunces headlines, mint
     eyebrows, ingredient ribbon, callout chips, verdict cards). GENERATED by build.py from this
     template: edit the template, not index.html. __DATA__ / __AUDIO__ / __DUR__ are filled per language. -->
<html lang="__LANG__">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Fraunces"; font-weight: 800; src: url("assets/fonts/fraunces-800.woff2") format("woff2"); }
      @font-face { font-family: "Manrope"; font-weight: 500; src: url("assets/fonts/manrope-500.woff2") format("woff2"); }
      @font-face { font-family: "Manrope"; font-weight: 700; src: url("assets/fonts/manrope-700.woff2") format("woff2"); }
      @font-face { font-family: "Naskh"; font-weight: 700; src: url("assets/fonts/naskh-700.woff2") format("woff2"); }
      :root { --bg: #052e22; --bg2: #0a4a35; --mint: #6ee7b7; --cream: #f4efe6; --paper: #f3ece2; --ink: #0d1210; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Manrope", sans-serif; color: var(--cream);
              background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%); }
      .clip { position: absolute; inset: 0; }
      #glow { position: absolute; left: 700px; top: 200px; width: 1400px; height: 1000px; border-radius: 50%;
              background: radial-gradient(closest-side, rgba(110,231,183,0.16), rgba(110,231,183,0)); }
      #ribbon { position: absolute; left: 0; top: 0; width: 4400px; height: 1080px; }

      .copy { position: absolute; left: 150px; top: 230px; width: 820px; }
      [dir="rtl"] .copy { text-align: right; }
      .eyebrow { font-weight: 700; font-size: 30px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mint); }
      .head { margin-top: 22px; font-family: "Fraunces", serif; font-weight: 800; font-size: 100px; line-height: 1.0; letter-spacing: -0.015em; }
      .head .ln { display: block; white-space: nowrap; }
      .head .ln.em { color: var(--mint); }
      .sub { margin-top: 30px; font-weight: 500; font-size: 34px; line-height: 1.4; color: rgba(244,239,230,0.82); width: 700px; }
      [lang="ar"] .head, [lang="ar"] .sub, [lang="ar"] .eyebrow, [lang="ar"] .word, [lang="ar"] .pill { font-family: "Naskh", serif; letter-spacing: 0; }

      .hook { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
      .hook .eyebrow { font-size: 34px; }
      .hook .big { margin-top: 26px; font-family: "Fraunces", serif; font-weight: 800; font-size: 168px; line-height: 1.0; letter-spacing: -0.02em; }
      .hook .big.em { margin-top: 6px; color: var(--mint); }

      #phonewrap { position: absolute; left: 1180px; top: 76px; width: 456px; height: 928px; }
      .phone { position: relative; width: 456px; height: 928px; border-radius: 66px; background: var(--ink); padding: 14px;
               box-shadow: 0 50px 110px rgba(0,0,0,0.45), inset 0 0 0 3px #2b3431; }
      .pscreen { position: relative; width: 428px; height: 900px; border-radius: 52px; overflow: hidden; background: var(--paper); }
      .scr { position: absolute; left: 0; top: 0; width: 100%; height: 900px; }
      .beam { position: absolute; left: 0; right: 0; top: 0; height: 110px;
              background: linear-gradient(180deg, rgba(52,211,153,0) 0%, rgba(52,211,153,0.4) 80%, rgba(110,231,183,1) 100%); opacity: 0; }

      .chip { position: absolute; display: flex; align-items: center; gap: 16px; padding: 20px 30px; border-radius: 24px; white-space: nowrap;
              background: #fff; color: var(--ink); font-weight: 700; font-size: 32px; box-shadow: 0 26px 60px rgba(0,0,0,0.35); }
      .dot { width: 22px; height: 22px; border-radius: 50%; flex: none; }
      .tag { padding: 6px 16px; border-radius: 12px; font-size: 24px; letter-spacing: 0.06em; color: #fff; background: #e11d48; }

      .vcard { position: absolute; left: 1060px; width: 700px; height: 268px; border-radius: 40px; overflow: hidden;
               background: var(--paper); box-shadow: 0 36px 90px rgba(0,0,0,0.45); }
      .vcard img { position: absolute; left: 0; top: -168px; width: 700px; }

      .pills { margin-top: 44px; display: flex; flex-wrap: wrap; gap: 18px; }
      [dir="rtl"] .pills { justify-content: flex-end; }
      .pill { padding: 16px 32px; border-radius: 999px; border: 3px solid rgba(110,231,183,0.55); font-weight: 700; font-size: 34px; color: var(--cream); }

      .lockup { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
      .icon { width: 230px; height: 230px; border-radius: 54px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.45); }
      .icon img { width: 100%; height: 100%; display: block; }
      .word { margin-top: 40px; font-family: "Fraunces", serif; font-weight: 800; font-size: 124px; line-height: 1; }
      .lockup .pills { justify-content: center; }
      .fine { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; font-weight: 500; font-size: 26px; color: rgba(244,239,230,0.6); }
    </style>
  </head>
  <body>
    <div id="root" dir="__DIR__" data-composition-id="main" data-start="0" data-duration="__DUR__" data-width="1920" data-height="1080">
__AUDIO__
      <div class="clip" id="bgclip" data-start="0" data-duration="__DUR__" data-track-index="0">
        <div id="glow"></div>
        <svg id="ribbon" viewBox="0 0 4400 1080" data-layout-allow-overflow data-layout-allow-occlusion></svg>
      </div>

      <div class="clip" id="s1" data-start="0" data-duration="__D1__" data-track-index="1">
        <div class="hook"><div class="eyebrow" id="s1-e"></div><div class="big" id="s1-h1"></div><div class="big em" id="s1-h2"></div></div>
      </div>

      <div class="clip" id="phclip" data-start="__PH_START__" data-duration="__PH_DUR__" data-track-index="2">
        <div id="phonewrap" data-layout-allow-overflow><div class="phone"><div class="pscreen">
          <img class="scr" id="p-home" src="__SCR_home__" alt="" />
          <div class="beam" id="beam" data-layout-allow-overflow></div>
          <img class="scr" id="p-gum" src="__SCR_gum__" alt="" />
          <img class="scr" id="p-gmid" src="__SCR_gmid__" alt="" />
          <img class="scr" id="p-dlg" src="__SCR_dlg__" alt="" />
          <img class="scr" id="p-han" src="__SCR_han__" alt="" />
          <img class="scr" id="p-en" src="assets/screens/gum_top_en.png" alt="" />
          <img class="scr" id="p-de" src="assets/screens/gum_top_de.png" alt="" />
          <img class="scr" id="p-fr" src="assets/screens/gum_top_fr.png" alt="" />
          <img class="scr" id="p-ar" src="assets/screens/gum_top_ar.png" alt="" />
          <img class="scr" id="p-hist" src="__SCR_hist__" alt="" />
          <img class="scr" id="p-eco" src="__SCR_eco__" alt="" />
        </div></div></div>
      </div>

__SCENES__
    </div>

    <script>
      const D = __DATA__;
      const tl = gsap.timeline({ paused: true });
      const T = D.t;                      // resolved cue times (seconds)
      const S = D.s;                      // scene starts

      // ---- text from data ----
      const setText = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
      // shrink headlines that are wider than the copy column (long languages) instead of wrapping
      document.querySelectorAll(".copy .head").forEach(h => {
        let size = 100;
        while ([...h.querySelectorAll(".ln")].some(l => l.scrollWidth > 820) && size > 60) { size -= 2; h.style.fontSize = size + "px"; }
      });
      setText("s1-e", D.str.s1.eyebrow); setText("s1-h1", D.str.s1.h1); setText("s1-h2", D.str.s1.h2);

      // ---- ingredient ribbon (built once, deterministic) ----
      (function ribbon() {
        const ns = "http://www.w3.org/2000/svg", svg = document.getElementById("ribbon");
        let d = "M -100 860";
        for (let x = -100; x < 4400; x += 1100) d += ` C ${x + 370} 740, ${x + 730} 980, ${x + 1100} 860`;
        const path = document.createElementNS(ns, "path");
        path.setAttribute("id", "rp"); path.setAttribute("d", d); path.setAttribute("fill", "none");
        path.setAttribute("stroke", "#f3ece2"); path.setAttribute("stroke-width", "78"); path.setAttribute("opacity", "0.95");
        svg.appendChild(path);
        const text = document.createElementNS(ns, "text");
        text.setAttribute("font-family", "Manrope"); text.setAttribute("font-weight", "700"); text.setAttribute("font-size", "32"); text.setAttribute("dy", "11");
        const tp = document.createElementNS(ns, "textPath"); tp.setAttribute("href", "#rp"); tp.setAttribute("startOffset", "30");
        const words = [...D.ribbon, ...D.ribbon, ...D.ribbon];
        words.forEach((w, i) => {
          const t = document.createElementNS(ns, "tspan");
          const flag = w[0] === "!" ? "#e11d48" : w[0] === "?" ? "#b45309" : null;
          t.textContent = (flag ? w.slice(1).toUpperCase() : w) + (i < words.length - 1 ? "  ·  " : "");
          t.setAttribute("fill", flag || "#4a4038");
          t.setAttribute("data-layout-allow-occlusion", "");
          t.setAttribute("data-layout-allow-overlap", "");     // curved path: neighbouring word boxes overlap by design   // decoration: passes behind phone and chips on purpose
          tp.appendChild(t);
        });
        text.setAttribute("data-layout-allow-occlusion", "");
        text.setAttribute("data-layout-allow-overlap", "");
        text.setAttribute("direction", "ltr");
        text.appendChild(tp); svg.appendChild(text);
      })();

      // ---- motion helpers: every tween lists the same properties in from and to (no flicker) ----
      const rise = (sel, t, dy = 30) => tl.fromTo(sel, { opacity: 0, y: dy }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.08, immediateRender: false }, t);
      const fall = (sel, t) => tl.fromTo(sel, { opacity: 1, y: 0 }, { opacity: 0, y: -24, duration: 0.25, ease: "power2.in", immediateRender: false }, t);
      const pop = (sel, t) => tl.fromTo(sel, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)", immediateRender: false }, t);
      const show = (sel, t, dur = 0.3) => tl.fromTo(sel, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: dur, ease: "power3.out", immediateRender: false }, t);
      const hide = (sel, t) => tl.fromTo(sel, { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, t);

      // initial states (build time, same for every worker)
      gsap.set(".copy .eyebrow, .copy .head .ln, .copy .sub, .copy .pill, .chip, .vcard, #s1-e, #s1-h1, #s1-h2, .lockup .icon, .lockup .word, .lockup .pill, .fine", { opacity: 0 });
      gsap.set(["#p-gum", "#p-gmid", "#p-dlg", "#p-han", "#p-en", "#p-de", "#p-fr", "#p-ar", "#p-hist", "#p-eco"], { opacity: 0 });
      gsap.set("#phonewrap", { y: 1000, x: 0 });

      // background drift for the whole film
      tl.fromTo("#ribbon", { x: 0 }, { x: -1600, duration: D.dur, ease: "none" }, 0);
      tl.fromTo("#glow", { scale: 1 }, { scale: 1.15, duration: D.dur, ease: "none" }, 0);

      // S1 hook
      rise("#s1-e", 0.2); rise("#s1-h1", 0.45, 40); rise("#s1-h2", T.know, 40);

      // S2 scan
      rise("#s2 .eyebrow, #s2 .head .ln", S[1]);
      tl.fromTo("#phonewrap", { y: 1000, x: 0 }, { y: 0, x: 0, duration: 0.6, ease: "expo.out", immediateRender: false }, S[1]);
      tl.fromTo("#beam", { opacity: 0, y: -110 }, { opacity: 1, y: -110, duration: 0.1, immediateRender: false }, T.scan);
      tl.fromTo("#beam", { opacity: 1, y: -110 }, { opacity: 1, y: 900, duration: 1.1, ease: "power1.inOut", immediateRender: false }, T.scan + 0.1);
      tl.fromTo("#beam", { opacity: 1 }, { opacity: 0, duration: 0.1, immediateRender: false }, T.scan + 1.2);

      // S3 answer: result slides up, then phone steps aside for the three verdict cards
      tl.fromTo("#p-gum", { opacity: 1, y: 900 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out", immediateRender: false }, S[2]);
      rise("#s3 .eyebrow, #s3 .head .ln, #s3 .sub", S[2] + 0.1);
      tl.fromTo("#phonewrap", { y: 0, x: 0 }, { y: 0, x: 900, duration: 0.5, ease: "power3.in", immediateRender: false }, T.halal - 0.45);
      ["#vc1", "#vc2", "#vc3"].forEach((c, i) => tl.fromTo(c, { opacity: 0, y: -60, rotation: [-2, 1.5, -1][i] }, { opacity: 1, y: 0, rotation: [-2, 1.5, -1][i], duration: 0.4, ease: "back.out(1.6)", immediateRender: false }, [T.halal, T.doubtful, T.haram][i]));

      // S4 exact ingredient
      tl.fromTo(["#vc1", "#vc2", "#vc3"], { opacity: 1, x: 0 }, { opacity: 0, x: 200, duration: 0.3, ease: "power2.in", stagger: 0.05, immediateRender: false }, S[3] - 0.2);
      tl.fromTo("#phonewrap", { y: 0, x: 900 }, { y: 0, x: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, S[3]);
      show("#p-gmid", S[3]);
      rise("#s4 .eyebrow, #s4 .head .ln", S[3] + 0.1);
      pop("#c4a", T.exactly); pop("#c4b", T.problem);

      // S5 madhhab
      show("#p-dlg", T.madhhab);
      rise("#s5 .eyebrow, #s5 .head .ln, #s5 .sub", S[4] + 0.1);
      show("#p-han", T.results); pop("#c5a", T.results + 0.2);

      // S6 European labels: language pills + matching result screens
      rise("#s6 .eyebrow, #s6 .head .ln", S[5] + 0.1);
      D.lscr.map((s, i) => [s, T["l" + (i + 1)]]).forEach(([s, t]) => tl.fromTo(s, { opacity: 1, x: 428 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, t));
      ["#lp1", "#lp2", "#lp3", "#lp4"].forEach((p, i) => pop(p, [T.l1, T.l2, T.l3, T.l4][i]));

      // S7 history, then E-number guide
      show("#p-hist", S[6]);
      rise("#s7a .eyebrow, #s7a .head .ln", S[6] + 0.1);
      show("#p-eco", T.enum);
      rise("#s7b .eyebrow, #s7b .head .ln", T.enum);

      // S8 closing lockup: ribbon sinks away so the lockup and fine print stand alone
      tl.fromTo("#ribbon", { y: 0, opacity: 1 }, { y: 260, opacity: 0, duration: 0.6, ease: "power2.in", immediateRender: false }, S[7] - 0.3);
      tl.fromTo("#phonewrap", { y: 0, x: 0 }, { y: 1100, x: 0, duration: 0.45, ease: "power3.in", immediateRender: false }, S[7] - 0.35);
      tl.fromTo(".lockup .icon", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.8)", immediateRender: false }, S[7]);
      rise(".lockup .word", S[7] + 0.15);
      ["#t1", "#t2", "#t3"].forEach((p, i) => pop(p, [T.p1, T.p2, T.p3][i]));
      rise(".fine", T.p3 + 0.4, 10);

      // copy blocks leave just before their scene clip ends
      Object.entries(D.ends).forEach(([id, end]) => {
        const sel = id === "s1" ? "#s1-e, #s1-h1, #s1-h2" : `#${id} .copy > *, #${id} .chip, #${id} .vcard`;
        if (id === "s3") return;      // verdict cards have their own exit in S4
        tl.fromTo(sel, { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, end - 0.22);
      });
      tl.fromTo("#s3 .copy > *", { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, D.ends.s3 - 0.22);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
