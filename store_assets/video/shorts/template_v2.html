<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Manrope"; font-weight: 700; src: url("assets/fonts/manrope-700.woff2") format("woff2"); }
      :root { --bg: #052e22; --mint: #6ee7b7; --white: #ffffff; --acc: {{ACCENT}}; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000;
              font-family: "Manrope", sans-serif; color: var(--white); }

      .broll { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; z-index: 0; }
      /* top shade so captions read over bright footage */
      .shade { position: absolute; left: 0; top: 0; width: 1080px; height: 1000px;
               background: linear-gradient(180deg, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0.38) 55%, rgba(0,0,0,0) 100%); }
      #shadewrap { position: absolute; inset: 0; z-index: 1; }
      .cap { z-index: 3; }

      /* captions: y 260-680, clear of the Shorts UI at the bottom */
      .cap { position: absolute; left: 0; top: 260px; width: 1080px; height: 420px; }
      .capline { position: absolute; left: 60px; right: 60px; top: 0; bottom: 0; display: flex; flex-wrap: wrap;
                 align-content: center; justify-content: center; gap: 0 24px; text-align: center; }
      .cw { font-family: "Archivo Black", sans-serif; font-size: 96px; line-height: 1.08; text-transform: uppercase;
            color: var(--white); opacity: 0; -webkit-text-stroke: 3px rgba(0,0,0,0.55);
            text-shadow: 0 6px 28px rgba(0,0,0,0.75); }
      .cw.key { color: var(--acc); }

      .endbg { position: absolute; inset: 0; z-index: 2; background: radial-gradient(circle at 50% 55%, #0b5d3b 0%, var(--bg) 70%); }
      .vis { position: absolute; z-index: 4; left: 0; top: 700px; width: 1080px; height: 800px; }
      .phone { position: absolute; left: 225px; top: -20px; width: 630px; height: 1330px; border-radius: 86px; background: #0d1210;
               padding: 18px; box-shadow: 0 50px 120px rgba(0,0,0,0.5), inset 0 0 0 4px #2b3431; }
      .pscreen { position: relative; width: 594px; height: 1294px; border-radius: 70px; overflow: hidden; background: #f3ece2; }
      .scr { position: absolute; left: 0; top: 0; width: 594px; }
      .beam { position: absolute; left: 0; right: 0; top: 0; height: 130px; opacity: 0;
              background: linear-gradient(180deg, rgba(52,211,153,0) 0%, rgba(52,211,153,0.4) 80%, rgba(110,231,183,1) 100%); }
      .lockup { position: absolute; left: 0; right: 0; top: 0; height: 800px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .icon { width: 300px; height: 300px; border-radius: 70px; overflow: hidden; opacity: 0; box-shadow: 0 30px 80px rgba(0,0,0,0.45); }
      .icon img { width: 100%; height: 100%; display: block; }
      .wordmark { margin-top: 48px; font-family: "Archivo Black", sans-serif; font-size: 116px; line-height: 1; opacity: 0; }
      .store { margin-top: 30px; padding: 16px 36px; border-radius: 999px; border: 3px solid var(--white); font-weight: 700; font-size: 44px; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{TOTAL}}" data-width="1080" data-height="1920">
      <audio id="music-bed" src="assets/bgm/bed.m4a" data-start="0" data-duration="{{TOTAL}}" data-volume="0.3"></audio>
      {{AUDIO}}

      {{CLIPS}}

      <div class="clip" id="shadewrap" data-start="0" data-duration="{{TOTAL}}" data-track-index="4"><div class="shade"></div></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const pop = (sel, t) => tl.fromTo(sel, { opacity: 0, y: 18, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.12, ease: "power3.out" }, t);
      {{JS}}

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
